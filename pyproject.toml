[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-life-os"
version = "0.1.0"
description = "Personal life management system"
requires-python = ">=3.11"

[project.scripts]
course-import = "personal_life_os.courses.cli:main"
personal-life-os-web = "personal_life_os.web:main"

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
