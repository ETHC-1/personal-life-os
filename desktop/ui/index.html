<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>个人生活 OS</title><link rel="stylesheet" href="styles.css" /></head>
  <body>
    <header class="titlebar" data-tauri-drag-region><div class="brand"><span class="logo">⌁</span><span>个人生活 OS</span><i>DESKTOP</i></div><div class="window-actions"><button data-window-action="minimize">−</button><button data-window-action="maximize">□</button><button class="close" data-window-action="close">×</button></div></header>
    <div class="app">
      <aside class="sidebar"><div class="profile"><div class="avatar">我</div><div><strong>我的空间</strong><small>本地个人工作台</small></div></div><nav><a class="active" href="#dashboard"><span>⌂</span>总览</a><a href="#agenda"><span>◷</span>日程</a><a href="#tasks"><span>✓</span>待办</a><a href="#classes"><span>▦</span>课程</a><a href="#rooms"><span>⌗</span>空教室</a></nav><div class="side-bottom"><a class="muted-link" href="#assistant"><span>✦</span>AI 助手 <em>即将推出</em></a><a class="muted-link" href="#sync"><span>⇄</span>同步中心 <em>即将推出</em></a><div class="local-status"><b></b>本地数据已连接</div></div></aside>
      <main><section class="welcome" id="dashboard"><div><p class="kicker">星期 <span id="weekday">—</span> · <span id="today">—</span></p><h1>今天，按自己的节奏推进。</h1><p class="subline">这是你的个人控制台，重要的事情都在这里。</p></div><div class="welcome-date"><strong id="day-number">—</strong><span id="month-label">—</span></div></section>
        <section class="stats"><article class="stat primary"><span>今日安排</span><strong id="agenda-count">—</strong><small>项日程</small><div class="stat-icon">◷</div></article><article class="stat"><span>未完成待办</span><strong id="todo-count">—</strong><small>项需要处理</small><div class="progress"><i id="todo-progress"></i></div></article><article class="stat"><span>本周课程</span><strong id="course-count">—</strong><small>门课程</small><div class="stat-icon blue">▦</div></article></section>
        <section class="workspace-grid"><article class="card agenda-card" id="agenda"><div class="card-head"><div><p class="kicker">NEXT UP</p><h2>接下来</h2></div><button class="outline-button" id="add-event">＋ 新建日程</button></div><div id="agenda-list" class="agenda-list"><div class="loading">正在读取安排…</div></div></article><article class="card focus-card" id="tasks"><div class="card-head"><div><p class="kicker">FOCUS</p><h2>今日待办</h2></div><button class="round-button" id="add-todo" title="添加待办">＋</button></div><div id="todo-list" class="todo-list"><div class="loading">正在读取待办…</div></div></article></section>
        <section class="card classes-card" id="classes"><div class="card-head"><div><p class="kicker">THIS WEEK</p><h2>本周课程</h2></div><span class="badge" id="semester">未设置学期</span></div><div class="week-grid" id="week-grid"></div></section>
        <section class="quick-grid" id="rooms"><button class="quick-card"><span class="quick-icon">⌗</span><span><b>空教室</b><small>查看东教学楼实时使用情况</small></span><strong>›</strong></button><button class="quick-card"><span class="quick-icon warm">↥</span><span><b>导入课表</b><small>同步 JSON、HTML 或校园网课表</small></span><strong>›</strong></button><button class="quick-card disabled" id="assistant"><span class="quick-icon purple">✦</span><span><b>AI 助手</b><small>自然语言管理你的生活安排</small></span><em>即将推出</em></button></section><footer>个人生活 OS · 数据仅保存在本机 · <span id="updated">—</span></footer></main>
    </div><script src="app.js"></script>
  </body>
</html>
